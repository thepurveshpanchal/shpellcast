name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      # There are no third-party dependencies, so there is nothing to
      # restore and nothing to audit for vulnerabilities. Keep it that way:
      # this step fails the build if a require block ever appears.
      - name: Assert zero dependencies
        run: |
          if grep -q '^require' go.mod; then
            echo "::error file=go.mod::shpellcast must stay dependency-free (see CONTRIBUTING.md)"
            exit 1
          fi

      - name: Formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race -count=1 ./...

      - name: Build
        run: make build

  loadtest:
    name: Capacity check
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build server and bench
        run: make build bench

      # A capacity regression is as real a bug as a failing unit test:
      # the bench exits non-zero if producers are refused, if viewers miss
      # more than 1% of lines, or if p99 latency exceeds 2s.
      - name: Run 100 concurrent sessions
        run: |
          ./bin/shpellcast -http 127.0.0.1:8080 -tcp 127.0.0.1:1337 \
            -base-url http://127.0.0.1:8080 -log-level warn &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 0.5
          done
          ./bin/shpellcast-bench -sessions 100 -viewers 2 -rate 5 -duration 20s

  release:
    name: Release binaries
    runs-on: ubuntu-latest
    needs: [check, loadtest]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cross-compile
        run: make release VERSION=${GITHUB_REF_NAME#v}

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.gz
            dist/SHA256SUMS
          body: |
            See [CHANGELOG.md](CHANGELOG.md) for what's in this release.

            Verify a download:
            ```
            sha256sum -c SHA256SUMS --ignore-missing
            ```
