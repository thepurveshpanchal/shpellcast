<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>shpellcast</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b0f14'/%3E%3Cpath d='M3 4l3 4-3 4' stroke='%233ddc84' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M8.5 12h4.5' stroke='%234cc2ff' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body data-session="{{ID}}">

<header>
  <span class="brand"><a href="/">shpellcast</a></span>
  <span class="sid">{{ID}}</span>
  <span class="status" id="status" data-state="connecting">
    <span class="dot"></span><span id="status-text">connecting</span>
  </span>
  <span class="spacer"></span>
  <span class="stats" id="stats"></span>
  <span class="actions">
    <button id="follow" type="button" aria-pressed="true" title="Stick to the end of the output">Follow</button>
    <button id="wrap" type="button" aria-pressed="false" title="Wrap long lines">Wrap</button>
    <button id="clear" type="button" title="Clear the display (does not delete the session)">Clear</button>
    <button id="copy" type="button" title="Copy this page's URL">Copy&nbsp;URL</button>
    <a class="btn" href="/s/{{ID}}/raw" title="Plain text, also usable with curl -N">Raw</a>
    <a class="btn" href="/s/{{ID}}/download" title="Download the retained output">Download</a>
  </span>
</header>

<div id="term" role="log" aria-live="polite" aria-label="Streamed command output"></div>

<script src="/static/app.js"></script>
</body>
</html>
