# shpellcast behind nginx.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/shpellcast
#   sudo ln -s /etc/nginx/sites-available/shpellcast /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d shpellcast.godtech.in
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then set, in /etc/shpellcast/shpellcast.env:
#   SHPELLCAST_HTTP=127.0.0.1:8080
#   SHPELLCAST_BASE_URL=https://shpellcast.godtech.in
#   SHPELLCAST_TRUST_PROXY=true
#
# nginx buffers proxied responses by default, which breaks live streaming
# completely: the page would stay blank until the job finished. Every
# streaming location below turns that off explicitly.

upstream shpellcast {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name shpellcast.godtech.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shpellcast.godtech.in;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/shpellcast.godtech.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/shpellcast.godtech.in/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Producers stream for as long as their job runs; never cap the body.
    client_max_body_size 0;

    # --- live output: SSE and the plain-text tail ---------------------
    location ~ ^/s/[^/]+/(stream|raw)$ {
        proxy_pass http://shpellcast;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;

        proxy_set_header Connection '';
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        include /etc/nginx/proxy_params;
    }

    # --- ingest: open-ended chunked uploads ---------------------------
    location ~ ^/i(/|$) {
        proxy_pass http://shpellcast;
        proxy_http_version 1.1;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        include /etc/nginx/proxy_params;
    }

    # --- everything else ----------------------------------------------
    location / {
        proxy_pass http://shpellcast;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
    }

    # Keep operational endpoints off the public internet.
    location /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://shpellcast;
        include /etc/nginx/proxy_params;
    }
}

# /etc/nginx/proxy_params should contain:
#   proxy_set_header Host              $host;
#   proxy_set_header X-Real-IP         $remote_addr;
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_set_header X-Forwarded-Host  $host;
